services:
  - type: web
    name: athena-bridge-v2
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    envVars:
      - key: ATHENA_SHARED_SECRET
        value: super_secret_shared_key_123!
      - key: RATE_LIMIT
        value: "10"
      - key: LOG_DIR
        value: logs
      - key: MAX_LOG_LINES
        value: "1000"
      - key: ARCHIVE_DAYS
        value: "7"
    plan: free
