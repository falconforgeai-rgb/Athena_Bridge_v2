services:
  - type: web
    name: athena-cap-bridge-v2
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ATHENA_SHARED_SECRET
        sync: false
